peers:
  a:
    ip_key: "machine_a_ip"
  b:
    ip_key: "machine_b_ip"

shared:
  use_topic_monitor: true
  use_heartbeat: true

  zenoh:
    transport: udp
    main_peer: a
    main_port: 7447

topics:
  a_to_b:
    - topic: "/heartbeat_a"
      zen_qos:
        priority: real_time
    - topic: "/size_test_a"
      zen_qos:
        priority: data
        express: true
  b_to_a:
    - topic: "/heartbeat_b"
      zen_qos:
        priority: real_time
    - topic: "/size_test_b"
      zen_qos:
        priority: data
        express: true
