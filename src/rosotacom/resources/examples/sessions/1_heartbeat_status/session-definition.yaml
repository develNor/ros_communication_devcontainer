# Test-tier capability markers (see docs/testing.md). Status-overview demo, not
# part of the automated test tiers.
test_tiers:
  single_machine: na
  multi_machine: na

peers:
  a:
    address: "data:machine_a_ip"
  b:
    address: "data:machine_b_ip"

peer_settings:
  a:
    domain_id: 46
    # inbound:
    #   keep_source_prefix: true
  b:
    domain_id: 47
    # inbound:
    #   keep_source_prefix: true

shared:
  use_heartbeat: true
  heartbeat:
    # The heartbeat's intended behavior. The status overview classifies the live
    # heartbeat against it (status.json `quality`/`reason`) and `rosotacom test`
    # asserts it. See docs/rfcs/0001-expectation-driven-test-suite.md.
    expect:
      hz: { min: 8, max: 12 }
      latency_ms: { max: 200 }
  # Maintain a continuously-updated per-topic pipeline status overview
  # (status.json / status.txt / events.jsonl under logs/<peer>/status/).
  # OTA stages are graph-only; this does not add OTA payload subscriptions.
  # Inspect it from the host with: rosotacom status 1_heartbeat_status
  use_status_overview: true
  rmw:
    local:
      cyclone:
        config: cyclonedds_minimal.xml
    ota:
      cyclone:
        config: cyclonedds_minimal.xml
  ota_domain_id: 48
