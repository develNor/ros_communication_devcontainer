peers:
  a:
    ip_key: "machine_a_ip"
  b:
    ip_key: "machine_b_ip"

shared:
  use_heartbeat: true
  ota_domain_id: 48

  # Version 1 (variant i/ii, both should work)
  rmw:
    local: zenoh
    ota: zenoh

  # Version 1, (variant ii/ii, both should work)
  rmw: zenoh

  # Version 2
  rmw:
    local: cyclone
    ota: zenoh_ros2dds

  # examples with non-default configs
  # Version 1 with config
  rmw:
    local: zenoh
    ota: 
      zenoh:
        main_peer: a
  # Version 2
  rmw:
    local: cyclone
    ota: 
      zenoh_ros2dds:
        transport: udp
        main_peer: a
        main_port: 7447


