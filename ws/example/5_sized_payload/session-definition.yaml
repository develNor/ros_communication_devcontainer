peers:
  a:
    ip_key: "machine_a_ip"
  b:
    ip_key: "machine_b_ip"

shared:
  use_topic_monitor: true
  use_heartbeat: false

  qos:
    defaults:
      depth: 1
    for_role:
      ota_sub:
        reliability: best_effort
        lifespan: 0.07
      ota_pub:
        reliability: best_effort
        lifespan: 0.07

topics:
  a_to_b:
    - topic: "/size_test_a"
      processing:
        use_ota_wrapper: true
  b_to_a:
    - topic: "/size_test_b"
      processing:
        use_ota_wrapper: true
