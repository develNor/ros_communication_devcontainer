name: Nightly E2E

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      full-rmw-matrix:
        description: "Run the generated heartbeat RMW matrix in addition to curated examples"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-e2e:
    name: full-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y just tmux

      - name: Set up local environment
        run: just setup

      - name: Show Docker environment
        run: docker info

      - name: Run local smoke slice
        run: just test-e2e-smoke

      - name: Run generated RMW matrix
        if: github.event.inputs.full-rmw-matrix != 'false'
        run: ROSOTACOM_RUN_E2E=1 ROSOTACOM_RUN_FULL_E2E=1 .venv/bin/python -m pytest -q tests/e2e/test_smoke.py -m e2e
