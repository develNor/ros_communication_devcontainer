# Illustrative network profiles (RFC 0004 — the emulated environment axis).
#
# A profile is a declarative tc/netem condition applied *below* rosotacom on the
# OTA interface, per direction (uplink != downlink — the defining feature of
# cellular). Select one with `rosotacom <cmd> --profile <name>`; `--profile none`
# (or omission) is the unshaped rung.
#
# These NUMBERS ARE ILLUSTRATIVE. Real, calibrated per-link profiles live in the
# operator's private baseline, not in this public example. Re-measure per link.
profiles:

  # Static "typical cellular" — the standard reproducible point condition.
  cellular-typical:
    uplink:   { rate: 4mbit,  delay: 120ms, jitter: 30ms, distribution: normal, loss: 2%, loss_correlation: 25% }
    downlink: { rate: 25mbit, delay: 60ms,  jitter: 20ms, loss: 0.5% }

  # Timeline — the substrate for the recovery genre (good -> degrade -> outage ->
  # restore). `outage: catchup` keeps the interface up (loss 100%; DDS survives,
  # recovery is "catch up"); use `reconnect` for the harsher link-down recovery.
  cellular-handover:
    timeline:
      - { for: 30s, uplink: { rate: 4mbit,   delay: 60ms,  loss: 0.1% } }
      - { for: 15s, uplink: { rate: 1mbit,   delay: 180ms, loss: 3%   } }
      - { for: 5s,  outage: catchup }
      - { for: 40s, uplink: { rate: 2.5mbit, delay: 90ms,  loss: 1%   } }

  # RFC 0007 gate profiles — the canonical public conditions of the regression
  # gate (see resources/benched-set.yaml). Deliberately plain committed netem
  # numbers with NO random elements: gated metrics are pinned by the emulated
  # rate/delay bottleneck, which is deterministic without a netem seed. This is
  # not optional on the public runner class — GitHub-hosted `tc` rejects the
  # netem `seed` option ("What is 'seed'?"), so seeded random loss/jitter cannot
  # even be installed there, and unseeded random netem would be non-deterministic.
  # A gate profile therefore uses rate/delay only (contract-tested); seeded
  # *load* randomness (sized_publisher interval jitter) is application-level and
  # works everywhere. Seeded random netem stays in the operator harness lanes.
  gate-nominal:
    uplink:   { rate: 20mbit, delay: 20ms }
    downlink: { rate: 20mbit, delay: 20ms }

  gate-tight:
    uplink:   { rate: 1mbit, delay: 40ms }
    downlink: { rate: 10mbit }

  # Public finding fixtures. These are small, deterministic emulation points used
  # by docs/findings; they intentionally carry no private host or calibration data.
  finding-3.2mbit:
    uplink: { rate: 3.2mbit }
    downlink: {}

  finding-3.1mbit:
    uplink: { rate: 3.1mbit }
    downlink: {}

  finding-delay-5ms:
    uplink: { delay: 5ms }
    downlink: {}

  finding-delay-50ms:
    uplink: { delay: 50ms }
    downlink: {}

  finding-delay-300ms:
    uplink: { delay: 300ms }
    downlink: {}

  finding-jitter18:
    uplink: { delay: 30ms, jitter: 18ms, distribution: normal }
    downlink: {}

  finding-jitter27:
    uplink: { delay: 30ms, jitter: 27ms, distribution: normal }
    downlink: {}

  finding-3.2mbit-jitter18:
    uplink: { rate: 3.2mbit, delay: 30ms, jitter: 18ms, distribution: normal }
    downlink: {}

  finding-tight-irregular:
    uplink: { rate: 3.2mbit, delay: 50ms, jitter: 18ms, distribution: normal }
    downlink: {}

  finding-spdp-tight:
    uplink: { rate: 3.2mbit }
    downlink: {}
