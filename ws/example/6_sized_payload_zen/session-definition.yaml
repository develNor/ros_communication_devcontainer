peers:
  a:
    ip_key: "machine_a_ip"
  b:
    ip_key: "machine_b_ip"

shared:
  use_topic_monitor: true
  use_heartbeat: true
  rmw_ota: zenoh
  local_domain_id: 47
  ota_domain_id: 48

  zenoh:
    transport: udp
    main_peer: a
    main_port: 7447

topics:
  a_to_b:
    - topic: "/heartbeat_a"
      type: "com_msgs/msg/Heartbeat"
      zen_qos:
        priority: real_time
    - topic: "/size_test_a"
      type: "com_msgs/msg/SizedPayload"
      zen_qos:
        priority: data
        express: true
  b_to_a:
    - topic: "/heartbeat_b"
      type: "com_msgs/msg/Heartbeat"
      zen_qos:
        priority: real_time
    - topic: "/size_test_b"
      type: "com_msgs/msg/SizedPayload"
      zen_qos:
        priority: data
        express: true
