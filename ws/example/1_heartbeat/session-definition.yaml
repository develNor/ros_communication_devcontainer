peers:
  a:
    ip_key: "machine_a_ip"
  b:
    ip_key: "machine_b_ip"

shared:
  use_heartbeat: true

  # Native rmw_zenoh_cpp for both local and OTA traffic.
  # A single zenoh router runs per machine (the ZEN window) and forwards across
  # peers over TCP. Because rmw_zenoh_cpp's router forwards across ROS domains,
  # each peer must use a distinct ROS_DOMAIN_ID (see peer_settings below) to
  # avoid cross-talk between local graphs.
  rmw: zenoh

peer_settings:
  a:
    domain_id: 46
  b:
    domain_id: 47
