name: Nightly E2E

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      full-rmw-matrix:
        description: "Run the generated heartbeat RMW matrix in addition to curated examples"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-e2e:
    # The same six slices the merge gate and the release run, instead of one
    # sequential `just test-e2e-smoke` over the whole suite (#198). Keeping the
    # monolith here was deliberate while the slices were hand-maintained `-k`
    # expressions that had silently stopped covering three files; #197's
    # test_e2e_slices_partition_the_whole_suite closed that, so the union is
    # now guaranteed to be the monolith.
    #
    # The gain is diagnosis: a red monolith says "e2e broke", six slices say
    # which area did. It also removes a load-induced flake. On 2026-08-11 the
    # nightly failed with nine "Timed out waiting for container readiness"
    # errors after 1h12m on one runner, while the same tests on the same commit
    # passed in the merge gate — where they are spread over six.
    name: smoke-e2e-${{ matrix.slice }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slice: [core, transforms, remote-assist, runtime-tools, benchmark-capacity, media-concurrency]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y just tmux

      - name: Set up local environment
        run: just setup

      - name: Show Docker environment
        run: docker info

      - name: Run E2E slice
        run: just test-e2e-slice ${{ matrix.slice }}

      - name: Upload smoke session artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-instances-smoke-${{ matrix.slice }}
          path: session-instances/
          if-no-files-found: ignore

  rmw-matrix:
    name: rmw-${{ matrix.session }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'schedule' || github.event.inputs.full-rmw-matrix != 'false'
    strategy:
      fail-fast: false
      matrix:
        session:
          - cyclone-local-zenoh-ros2dds-ota
          - cyclone-ota
          - fastdds
          - zen-endpoints
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y just tmux

      - name: Set up local environment
        run: just setup

      - name: Show Docker environment
        run: docker info

      - name: Run generated RMW matrix session
        run: just test-e2e-rmw ${{ matrix.session }}

      - name: Upload RMW session artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-instances-rmw-${{ matrix.session }}
          path: session-instances/
          if-no-files-found: ignore
