name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.12"
          CHECKSUM="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # --fail, or a transient HTTP error body is saved as the tarball and
          # reported as "computed checksum did NOT match" — which reads like a
          # tampered release. That cost this PR a full gate run.
          curl -sSLf --retry 3 --retry-all-errors -o actionlint.tar.gz "$URL"
          echo "${CHECKSUM}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm actionlint.tar.gz

      - name: Run actionlint
        run: actionlint -color

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime
          deny-licenses: GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later

  build-lint:
    name: build-lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Set up local environment
        run: just setup

      - name: Run build lint
        run: just lint-build

  merge-lightweight:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Set up local environment
        run: just setup

      - name: Required non-Docker checks
        run: |
          just lint
          just typecheck
          just test-nondocker-cov
          just docs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: nondocker
          name: python-3.12
          token: ${{ secrets.CODECOV_TOKEN }}

  package:
    name: package
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Set up local environment
        run: just setup

      - name: Validate package
        run: just package

  preflight-success:
    name: preflight-success
    runs-on: ubuntu-latest
    needs: [workflow-lint, dependency-review, build-lint, merge-lightweight, package]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Check preflight jobs
        run: |
          if [[ "${{ needs.workflow-lint.result }}" != "success" ]]; then
            echo "workflow-lint failed: ${{ needs.workflow-lint.result }}"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.dependency-review.result }}" != "success" ]]; then
            echo "dependency-review failed: ${{ needs.dependency-review.result }}"
            exit 1
          fi
          if [[ "${{ needs.build-lint.result }}" != "success" ]]; then
            echo "build-lint failed: ${{ needs.build-lint.result }}"
            exit 1
          fi
          if [[ "${{ needs.merge-lightweight.result }}" != "success" ]]; then
            echo "merge-lightweight failed: ${{ needs.merge-lightweight.result }}"
            exit 1
          fi
          if [[ "${{ needs.package.result }}" != "success" ]]; then
            echo "package failed: ${{ needs.package.result }}"
            exit 1
          fi
          echo "All preflight checks passed"

  image:
    # Publish the images the e2e suite builds, once per set of build inputs,
    # instead of rebuilding them in each of thirteen jobs. #236 measured that
    # build at 154s per job: 57s pulling the multi-GB ROS base from Docker Hub,
    # 40s exporting layers, 47s of apt and pip. A pull from GHCR — co-located
    # with the runners, no Hub rate limit, one transfer instead of a transfer
    # plus a build — replaces all of it, and takes twelve of the thirteen Hub
    # pulls off the merge gate's critical path.
    #
    # The tag is a hash of everything that decides the image (base digest,
    # package lists, Dockerfile, entrypoint, ros2docker version, build UID):
    # `rosotacom image references` derives it, nothing here chooses it. A
    # build-input change is therefore a different tag, so "the published image
    # is stale" is not a state this can reach — which is the objection #226
    # raised against caching the image inline.
    #
    # Runs beside preflight rather than after it: on a hit it inspects two
    # manifests and stops, so it is never on the critical path.
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
    outputs:
      repository: ${{ steps.publish.outputs.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Set up local environment
        run: just setup

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Publish every image the e2e suite builds
        id: publish
        run: |
          set -euo pipefail
          repository="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rosotacom-e2e"
          # The packaged example project, because that is the one the e2e tests
          # copy. The repository's own rosotacom.yaml points at profiles and
          # artifacts that live beside the checkout in the private harness, so it
          # does not resolve here.
          project="$(.venv/bin/rosotacom resources path examples)/rosotacom.yaml"
          .venv/bin/rosotacom image references --project "$project" --repository "$repository" > references.txt
          cat references.txt

          while read -r reference; do
            if docker manifest inspect "$reference" >/dev/null 2>&1; then
              echo "present: $reference"
              continue
            fi
            echo "missing, building: $reference"
            .venv/bin/rosotacom image build --project "$project" --reference "$reference"
            docker push "$reference" || echo "::warning::could not push $reference"
          done < references.txt

          # Report the repository only when every reference resolves. A
          # read-only GITHUB_TOKEN (a fork PR, Dependabot) can log in and pull
          # but not push, and the slices must then build as they always did
          # rather than fail on a pull that was never going to work. Probed
          # rather than predicted from the event, so it stays right when
          # GitHub's token rules change.
          available=true
          while read -r reference; do
            docker manifest inspect "$reference" >/dev/null 2>&1 || available=false
          done < references.txt

          if [[ "$available" == "true" ]]; then
            echo "repository=$repository" >> "$GITHUB_OUTPUT"
          else
            echo "repository=" >> "$GITHUB_OUTPUT"
            echo "::warning::published images unavailable; each e2e slice will build its own"
          fi

  e2e:
    # One matrix job, not six near-identical copies. The copies were how
    # `e2e-media` ended up listed in ci-success's `needs` with no check on its
    # result: a failing media slice did not fail the gate. A matrix has one
    # result for all slices, so that hole cannot be reopened by forgetting a
    # paragraph. The slice list is the same one release.yml expands, and
    # tests/contract/test_workflow_contracts.py keeps the three workflows and
    # the justfile agreeing.
    #
    # The slices are chosen by measured cost, not grouped by theme (#226):
    # themed slices spanned 7m39s to 18m31s, and one test ran in two of them.
    # Thirteen rather than six because the model that predicted the balanced
    # six within 25s also says twelve reaches the floor and more buys nothing
    # (#235). Which tests a slice owns and what each costs is E2E_SLICES in
    # tests/e2e/conftest.py — change that, not this line, to move a test.
    name: e2e-${{ matrix.slice }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [preflight-success, image]
    if: always() && !cancelled() && needs.preflight-success.result == 'success' && needs.image.result == 'success'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        slice: [heartbeat, chatter, occupancy-grid, sized-payload, remote-assist, remote-assist-streams, runtime-tools, media, concurrency, benchmark-ab, benchmark-replay, benchmark-capacity, benchmark-capacity-cases]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y just tmux

      - name: Set up local environment
        run: just setup

      - name: Show Docker environment
        run: docker info

      - name: Log in to GHCR
        if: needs.image.outputs.repository != ''
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Run E2E slice
        env:
          # Empty when the `image` job could not publish, and then rosotacom
          # builds exactly as before. Set, and each image build becomes a pull
          # of the tag this tree's own build inputs hash to — rosotacom derives
          # that tag itself and never accepts one, so it cannot be pointed at an
          # image built from something else.
          ROSOTACOM_IMAGE_CACHE: ${{ needs.image.outputs.repository }}
        run: just test-e2e-slice ${{ matrix.slice }}

      - name: Upload session artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-instances-e2e-${{ matrix.slice }}
          path: session-instances/
          if-no-files-found: ignore

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - dependency-review
      - build-lint
      - merge-lightweight
      - package
      - preflight-success
      - image
      - e2e
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.workflow-lint.result }}" != "success" ]]; then
            echo "workflow-lint failed or was skipped: ${{ needs.workflow-lint.result }}"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.dependency-review.result }}" != "success" ]]; then
            echo "dependency-review failed: ${{ needs.dependency-review.result }}"
            exit 1
          fi
          if [[ "${{ needs.build-lint.result }}" != "success" ]]; then
            echo "build-lint failed or was skipped: ${{ needs.build-lint.result }}"
            exit 1
          fi
          if [[ "${{ needs.merge-lightweight.result }}" != "success" ]]; then
            echo "merge-lightweight failed or was skipped: ${{ needs.merge-lightweight.result }}"
            exit 1
          fi
          if [[ "${{ needs.package.result }}" != "success" ]]; then
            echo "package failed or was skipped: ${{ needs.package.result }}"
            exit 1
          fi
          if [[ "${{ needs.preflight-success.result }}" != "success" ]]; then
            echo "preflight-success failed or was skipped: ${{ needs.preflight-success.result }}"
            exit 1
          fi
          if [[ "${{ needs.image.result }}" != "success" ]]; then
            echo "image failed or was skipped: ${{ needs.image.result }}"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "one or more e2e slices failed or were skipped: ${{ needs.e2e.result }}"
            exit 1
          fi
          echo "ci-success passed"
