# The benched set (RFC 0007 §4) — the curated registry of gated benchmark rows.
#
# Workflows and the CLI *read* this file; no workflow hardcodes a row list.
# List rows:   rosotacom benchmark rows [--lane merge-gate|nightly]
# Run one row: rosotacom benchmark row <id> --rosotacom-config <project>/rosotacom.yaml
#
# Curation rules (RFC 0007 "honest limits"):
# - This is a whitelist. Every row carries an operator-visible `reason`;
#   a matrix nobody can afford to keep green is a monitor with extra steps.
# - `metrics` are the banded, blocking metrics; prefer bottleneck-dominated ones
#   (loss, completeness, capacity breakpoints) whose value is pinned by the
#   emulated profile, not by shared-runner host timing. `monitor` metrics are
#   recorded in the verdict but never block; latency percentiles stay there
#   unless a calibration proves they can hold a tight band (RFC 0007 §3).
# - Gated windows span >= 60 s (2 CycloneDDS SPDP discovery periods) or say why
#   not in `window_note`.
# - Seed policy is explicit: random load elements commit their seed here; random
#   netem elements commit their seed in the profile (contract-tested).
# - Row ids key the committed bands in budgets.jsonl: renaming a row is a
#   recalibration (`rosotacom benchmark calibrate <id> <K runs> --budgets ...`).
#
# Profiles are the committed public gate profiles in
# src/rosotacom/resources/examples/profiles.yaml (plain netem numbers; private
# per-link calibration data stays in the operator harness).

version: 1

rows:
  # ------------------------------------------------------------------ #
  # merge-gate: one minutes-scale row on every PR (RFC 0007 §4)
  # ------------------------------------------------------------------ #
  - id: probe-loss-tight-cyclone
    lane: merge-gate
    reason: >-
      Per-PR regression row: steady load at ~2x the emulated uplink capacity
      pins loss to the bottleneck, not host timing — a minutes-scale band
      assert on the default RMW.
    rmw: cyclone
    genre: probe
    profile: gate-tight
    duration_s: 60
    load: { size: 12000, rate_hz: 20.0 }
    metrics: [loss_pct]
    floors: { loss_pct: 0.5 }
    monitor: [latency_p50_ms, latency_p95_ms]

  # ------------------------------------------------------------------ #
  # nightly: default RMW deep (nominal + tight × steady + GOP + breakpoint)
  # ------------------------------------------------------------------ #
  - id: probe-loss-nominal-cyclone
    lane: nightly
    reason: >-
      A clean link must stay clean: completeness on the nominal profile catches
      ambient loss creep that tight-profile rows would mask.
    rmw: cyclone
    genre: probe
    profile: gate-nominal
    duration_s: 60
    load: { size: 12000, rate_hz: 20.0 }
    metrics: [loss_pct]
    floors: { loss_pct: 0.5 }
    monitor: [latency_p50_ms, latency_p95_ms]

  - id: probe-loss-gop-tight-cyclone
    lane: nightly
    reason: >-
      Camera-shaped burst load (GOP keyframe/delta size pattern with seeded
      interval jitter) at ~0.8x the tight uplink: keyframe bursts must be
      absorbed losslessly when the mean rate fits — the realistic-load
      headroom coverage a steady row cannot give (RFC 0007 motivation #4).
      Deliberately not overloaded: on the emulated bottleneck, burst loads sit
      on a knife-edge (sub-capacity absorbs, sustained overload drops a
      fragment of every large message — a blackout, unbandable); the graded
      overload regime belongs to the steady rows.
    rmw: cyclone
    genre: probe
    profile: gate-tight
    duration_s: 60
    load:
      size_pattern: 1x12KB+1x2KB+3x3KB
      rate_hz: 20.0
      interval_jitter_ms: 20.0
      interval_jitter_seed: 42
    metrics: [loss_pct]
    floors: { loss_pct: 0.5 }
    monitor: [latency_p50_ms, latency_p95_ms]

  - id: capacity-size-tight-cyclone
    lane: nightly
    reason: >-
      The capacity breakpoint (largest payload the tight uplink still carries
      under the loss/latency oracle) — the headline working-envelope number for
      the default RMW.
    rmw: cyclone
    genre: capacity
    profile: gate-tight
    duration_s: 10
    window_note: >-
      Capacity probes are deliberately short point checks inside the binary
      search; the banded metric is the breakpoint pinned by the emulated rate
      limit, not a windowed statistic of one probe.
    search: { knob: size, low: 3000, high: 9000, rate_hz: 20.0 }
    oracle: { max_loss_pct: 5.0, max_latency_ms: 1000.0 }
    metrics: [capacity_size]

  # ------------------------------------------------------------------ #
  # nightly: remaining supported RMW variants, shallow (one tight row each)
  # ------------------------------------------------------------------ #
  - id: probe-loss-tight-fastdds
    lane: nightly
    reason: >-
      Shallow FastDDS coverage: single-datagram payloads at ~2x the tight
      uplink via rate, so an RMW-specific transport regression cannot hide
      behind the Cyclone-only gate. Above-MTU payloads are deliberately not
      used here: FastDDS ships them as one UDP datagram that IP-fragments, and
      under sustained overload every datagram loses a fragment — a total
      blackout, which is a finding, not a bandable row.
    rmw: fastdds
    genre: probe
    profile: gate-tight
    duration_s: 60
    load: { size: 1200, rate_hz: 200.0 }
    metrics: [loss_pct]
    floors: { loss_pct: 0.5 }
    monitor: [latency_p50_ms, latency_p95_ms]

  - id: probe-loss-tight-zenoh
    lane: nightly
    reason: >-
      Shallow Zenoh coverage completing the supported-RMW axis: 12 KB messages
      at ~0.8x the tight uplink must arrive clean. Deliberately sub-capacity:
      the initial runner-class calibration measured zenoh's sustained-overload
      loss as state-dependent (23-61 % across K=5 at 2x, sigma ~15 pp) — that
      behaviour is a finding to characterize, not a bandable gate (RFC 0007
      "a flaky gate is worse than none").
    rmw: zenoh
    genre: probe
    profile: gate-tight
    duration_s: 60
    load: { size: 4500, rate_hz: 20.0 }
    metrics: [loss_pct]
    floors: { loss_pct: 0.5 }
    monitor: [latency_p50_ms, latency_p95_ms]
