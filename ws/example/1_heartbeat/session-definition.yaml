peers:
  a:
    ip_key: "machine_a_ip"
  b:
    ip_key: "machine_b_ip"

shared:
  use_heartbeat: true
  ota_domain_id: 48

  # Native rmw_zenoh_cpp for both local and OTA traffic.
  # A single zenoh router runs per machine (the ZEN window) and forwards across
  # peers over TCP. Because rmw_zenoh_cpp's router forwards across ROS domains,
  # each logical graph (per-peer local + shared OTA) must pin its own
  # ROS_DOMAIN_ID -- so all three of ota_domain_id, peer.a.domain_id,
  # peer.b.domain_id must be set and distinct.
  rmw: zenoh

peer_settings:
  a:
    domain_id: 46
  b:
    domain_id: 47
