# Synthetic camera-quality probe for offline PSNR/SSIM.
#
# This session is not part of the default smoke matrix because it needs the
# ffmpeg image transport path and metric stage bags. The dedicated e2e test runs
# it, records the sender's raw stage and receiver's decoded /raw stage, then
# checks them with `rosotacom videoquality`.

experimental: true
local_check: false

peers:
  a: {}
  b: {}

peer_settings:
  a:
    domain_id: 46
  b:
    domain_id: 47

shared:
  rmw: cyclone
  ota_domain_id: 48
  use_topic_monitor: true
  use_heartbeat: true
  use_status_overview: true
  metric_backbone:
    record_stages: true
  heartbeat:
    expect:
      hz: { min: 5, max: 20 }
      latency_ms: { max: 1000 }
      loss_pct: { max: 5 }
  qos:
    for_role:
      ota_sub:
        depth: 1
        reliability: best_effort
        lifespan: 0.7
      ota_pub:
        depth: 1
        reliability: best_effort
        lifespan: 0.7

topics:
  b_to_a:
    - topic: "/camera/image"
      type: "sensor_msgs/msg/Image"
      processing:
        transport:
          type: ffmpeg
          local_republish: true
          gop_size: 4
          bit_rate: 2000000
      expect:
        hz: { min: 3, max: 8 }
        latency_ms: { max: 1000 }
