name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  non-docker:
    name: non-docker (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Set up local environment
        run: just setup

      - name: Run non-Docker checks
        run: |
          just lint
          just typecheck
          just test-unit
          just test-contract
          just docs

  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Set up local environment
        run: just setup

      - name: Build and validate distributions
        run: just package

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  fast-e2e:
    name: fast-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y just tmux

      - name: Set up local environment
        run: just setup

      - name: Show Docker environment
        run: docker info

      - name: Run single-machine smoke matrix
        run: just test-e2e-smoke

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [non-docker, package, fast-e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # No GitHub environment: authorization is the per-repo Trusted Publisher
    # (registered with a blank environment), so this needs no environment-admin
    # rights in any repo that shares this file.
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Remove checksum sidecar
        run: rm -f dist/SHA256SUMS

      - name: Verify configured publishing target
        env:
          PYPI_PUBLISH_URL: ${{ vars.PYPI_PUBLISH_URL }}
        run: |
          if [ -z "$PYPI_PUBLISH_URL" ]; then
            echo "::error::PYPI_PUBLISH_URL is not configured for this repository."
            exit 1
          fi
          case "$PYPI_PUBLISH_URL" in
            https://*) ;;
            *)
              echo "::error::PYPI_PUBLISH_URL must be an HTTPS endpoint."
              exit 1
              ;;
          esac

      # The destination is repository configuration, not shared git content:
      # rehearsal index in the development fork, production index upstream.
      # Trusted Publisher registration remains the authorization boundary.
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ vars.PYPI_PUBLISH_URL }}
          skip-existing: true

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify release notes
        run: |
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error file=${notes_file}::Missing release notes for ${GITHUB_REF_NAME}. Copy docs/release-notes/TEMPLATE.md to this path in the release PR."
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=${notes_file}" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi
