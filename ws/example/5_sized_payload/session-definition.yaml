peers:
  a:
    ip_key: "machine_a_ip"
  b:
    ip_key: "machine_b_ip"

shared:
  use_topic_monitor: true
  use_heartbeat: false

  qos:
    defaults:
      depth: 1
    for_role:
      ota_sub:
        reliability: best_effort
      ota_pub:
        reliability: best_effort

topics:
  a_to_b:
    - "/size_test_a"
  b_to_a:
    - "/size_test_b"
