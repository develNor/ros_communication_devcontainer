# Test-tier capability markers (see docs/testing.md). Teaching example, not part
# of the automated test tiers yet.
test_tiers:
  single_machine: na
  multi_machine: na

peers:
  a:
    address: "data:machine_a_ip"
  b:
    address: "data:machine_b_ip"

peer_settings:
  a:
    domain_id: 46
  b:
    domain_id: 47

shared:
  use_topic_monitor: true
  use_heartbeat: true
  ota_domain_id: 48

  rmw:
    local: cyclone
    ota:
      zenoh_ros2dds:
        transport: udp
        main_peer: a
        main_port: 7447

topics:
  b_to_a:
    - topic: "/heartbeat_b"
      type: "com_msgs/msg/Heartbeat"
      zen_qos:
        priority: real_time
    - topic: "/costmap/costmap"
      type: "nav_msgs/msg/OccupancyGrid"
      processing:
        restamp_if: true
        compress: true
      zen_qos:
        priority: data
        express: true
