name: Nightly E2E

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      full-rmw-matrix:
        description: "Run the generated heartbeat RMW matrix in addition to curated examples"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-e2e:
    # The same diagnostic slices the merge gate and the release run, instead of one
    # sequential `just test-e2e-smoke` over the whole suite (#198). Keeping the
    # monolith here was deliberate while the slices were hand-maintained `-k`
    # expressions that had silently stopped covering three files; #197's
    # test_e2e_slices_partition_the_whole_suite closed that, so the union is
    # now guaranteed to be the monolith.
    #
    # The gain is diagnosis: a red monolith says "e2e broke"; a named slice says
    # which area and, where relevant, which transport or behavior failed. It
    # also removes a load-induced flake. On 2026-08-11 the
    # nightly failed with nine "Timed out waiting for container readiness"
    # errors after 1h12m on one runner, while the same tests on the same commit
    # passed in the merge gate — where they were spread over six at the time.
    name: smoke-e2e-${{ matrix.variant }}-${{ matrix.slice }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [kilted, lyrical]
        slice:
          - heartbeat
          - chatter
          - occupancy-grid-dds
          - occupancy-grid-zenoh
          - sized-payload-fastdds
          - sized-payload-zenoh
          - remote-assist
          - remote-assist-costmap
          - remote-assist-camera
          - runtime-tools
          - media
          - concurrency-parallel
          - concurrency-conflict
          - benchmark-ab
          - benchmark-replay
          - benchmark-capacity
          - benchmark-capacity-cases

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Ensure tmux
        # Preinstalled on the GitHub-hosted image, so this is a probe
        # rather than an install — but the dependency is named, so a
        # runner image that drops it fails here instead of inside a
        # session.
        run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }

      - name: Set up local environment
        run: just setup

      - name: Show Docker environment
        run: docker info

      - name: Run E2E slice
        env:
          ROSOTACOM_ROS2DOCKER_CONFIG: ${{ matrix.variant == 'lyrical' && format('{0}/src/rosotacom/resources/examples/ros2docker.lyrical.json', github.workspace) || '' }}
        run: just test-e2e-slice ${{ matrix.slice }}

      - name: Upload smoke session artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-instances-smoke-${{ matrix.variant }}-${{ matrix.slice }}
          path: session-instances/
          if-no-files-found: ignore

  rmw-matrix:
    name: rmw-${{ matrix.variant }}-${{ matrix.session }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'schedule' || github.event.inputs.full-rmw-matrix != 'false'
    strategy:
      fail-fast: false
      matrix:
        variant: [kilted, lyrical]
        session:
          - cyclone-local-zenoh-ros2dds-ota
          - cyclone-ota
          - fastdds
          - fastdds-default
          - zen-endpoints
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Ensure tmux
        # Preinstalled on the GitHub-hosted image, so this is a probe
        # rather than an install — but the dependency is named, so a
        # runner image that drops it fails here instead of inside a
        # session.
        run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }

      - name: Set up local environment
        run: just setup

      - name: Show Docker environment
        run: docker info

      - name: Run generated RMW matrix session
        env:
          ROSOTACOM_ROS2DOCKER_CONFIG: ${{ matrix.variant == 'lyrical' && format('{0}/src/rosotacom/resources/examples/ros2docker.lyrical.json', github.workspace) || '' }}
        run: just test-e2e-rmw ${{ matrix.session }}

      - name: Upload RMW session artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-instances-rmw-${{ matrix.variant }}-${{ matrix.session }}
          path: session-instances/
          if-no-files-found: ignore
