# Test-tier capability markers (see docs/testing.md).
test_tiers:
  single_machine: ok
  multi_machine: na

peers:
  a:
    address: "data:machine_a_ip"
  b:
    address: "data:machine_b_ip"

peer_settings:
  a:
    domain_id: 46
  b:
    domain_id: 47

shared:
  use_topic_monitor: true
  use_heartbeat: true
  ota_domain_id: 48

  qos:
    defaults:
      depth: 1
    for_role:
      ota_sub:
        reliability: best_effort
      ota_pub:
        reliability: best_effort

topics:
  b_to_a:
    - topic: "/costmap/costmap"
      type: "nav_msgs/msg/OccupancyGrid"
      processing:
        restamp_if: true
        compress: true
      # Declared behavioral contract: read by the status overview (live warnings)
      # and asserted by `rosotacom test`. See docs/rfcs/0001-expectation-driven-test-suite.md.
      expect:
        hz: { min: 1, max: 5 }
        latency_ms: { max: 500 }
